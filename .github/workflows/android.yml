name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nada-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulatorTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: run instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          script: |
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            adb logcat -c
            (adb logcat -v threadtime > "$RUNNER_TEMP/nada-logcat.txt" 2>&1 &)
            set +e
            gradle -p android connectedDebugAndroidTest
            STATUS=$?
            pkill -f 'adb logcat' || true
            exit $STATUS
      - name: upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-diagnostics
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/nada-logcat.txt
          if-no-files-found: ignore
